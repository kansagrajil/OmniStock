<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers - OmniStock</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
</head>

<body>
    <nav class="sidebar"></nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <header class="page-header animate__animated animate__fadeInDown">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item small"><a href="dashboard.html"
                                class="text-muted text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item small active" aria-current="page">Suppliers</li>
                    </ol>
                </nav>
                <div class="d-flex align-items-center gap-2">
                    <h2 class="mb-0 h3 fw-bold">Suppliers</h2>
                    <span class="badge bg-primary-light text-primary-dark rounded-pill px-3 py-2"
                        id="totalSuppliersCount">0 Total</span>
                </div>
            </div>
            <div class="header-actions d-flex gap-2">

                <button class="btn btn-primary px-4 py-2" id="btnAddSupplier">
                    <i class="bi bi-plus-lg me-2"></i> Add Supplier
                </button>
            </div>
        </header>

        <div class="row g-4 animate__animated animate__fadeInUp" id="supplierList">
            <div class="col-12 text-center p-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="supplierModal" class="modal-overlay hidden">
        <div class="modal" style="max-width: 700px">
            <div class="modal-header">
                <h5 id="modalTitle">Add New Supplier</h5>
                <button class="modal-close" id="btnModalClose">&times;</button>
            </div>
            <form id="supplierForm">
                <div class="modal-body">
                    <input type="hidden" id="supplierId">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <div class="form-group mb-3">
                                <label for="name" class="form-label">Supplier Name *</label>
                                <input type="text" id="name" class="form-control" required placeholder="Company Name">
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-group mb-3">
                                <label for="email" class="form-label">Email Address *</label>
                                <input type="email" id="email" class="form-control" required
                                    placeholder="contact@example.com">
                            </div>
                        </div>
                    </div>
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <div class="form-group mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="text" id="phone" class="form-control" placeholder="+1-555-0100">
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-group mb-3">
                                <label for="country" class="form-label">Country</label>
                                <input type="text" id="country" class="form-control" placeholder="USA">
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" class="form-control" placeholder="123 Street Name">
                    </div>
                    <div class="row">
                        <div class="col col-6">
                            <div class="form-group">
                                <label for="city">City</label>
                                <input type="text" id="city" class="form-control" placeholder="San Francisco">
                            </div>
                        </div>
                    </div>

                    <div class="form-group mt-3">
                        <label for="supplierImage">Supplier Image</label>
                        <input type="file" id="supplierImage" class="form-control" accept="image/*">
                        <div id="imagePreview" class="mt-2 text-center hidden">
                            <img src="" alt="Preview" style="max-height: 100px; border-radius: 8px;">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Supplier</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api-v2.js"></script>
    <script src="../assets/js/auth-v2.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
        if (!checkAuth()) window.location.href = 'login.html';

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar('suppliers');
            setupEventListeners();
            loadSuppliers();
        });

        function setupEventListeners() {
            // Add Supplier button
            const btnAdd = document.getElementById('btnAddSupplier');
            if (btnAdd) btnAdd.addEventListener('click', openAddModal);

            // Modal Controls
            function handleClose() {
                closeModal();
            }

            const btnClose = document.getElementById('btnModalClose');
            if (btnClose) btnClose.onclick = handleClose;

            const btnCancel = document.getElementById('btnCancel');
            if (btnCancel) btnCancel.onclick = handleClose;

            // Close modal on overlay click
            const modal = document.getElementById('supplierModal');
            if (modal) {
                modal.addEventListener('click', function (e) {
                    if (e.target === this) {
                        closeModal();
                    }
                });
            }
        }

        async function loadSuppliers() {
            try {
                Loader.show();
                const suppliers = await API.suppliers.getAll();
                document.getElementById('totalSuppliersCount').textContent = `${suppliers.length} Total`;
                renderSuppliers(suppliers);
            } catch (error) {
                Toast.error('Failed to load suppliers');
            } finally {
                Loader.hide();
            }
        }

        function renderSuppliers(suppliers) {
            const list = document.getElementById('supplierList');
            if (!suppliers.length) {
                list.innerHTML = '<div class="col col-12 text-center p-5 text-muted">No suppliers found</div>';
                return;
            }

            list.innerHTML = suppliers.map(s => `
                <div class="col col-12 col-md-6 col-lg-4 animate__animated animate__fadeInUp">
                    <div class="card h-100 border-0 shadow-sm transition-hover" style="border-radius: 16px;">
                        <div class="card-body p-4">
                            <div class="d-flex align-items-start justify-content-between mb-4">
                                <div class="bg-primary-light text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold overflow-hidden" 
                                     style="width: 54px; height: 54px; font-size: 1.5rem;">
                                    ${s.image && s.image !== 'default-supplier.png'
                    ? `<img src="/uploads/${s.image}" class="w-100 h-100 object-fit-cover">`
                    : s.name.charAt(0)}
                                </div>
                                <div class="dropdown">
                                    <button class="btn btn-light btn-sm rounded-pill px-3" data-action="edit" data-id="${s._id}">
                                        <i class="bi bi-pencil-square me-1"></i> Edit
                                    </button>
                                </div>
                            </div>
                            <h5 class="fw-bold text-dark mb-1">${s.name}</h5>
                            <div class="d-flex align-items-center gap-1 text-muted small mb-3">
                                <i class="bi bi-geo-alt"></i>
                                ${s.city ? s.city + ', ' + (s.country || '') : (s.country || 'Global')}
                            </div>
                            
                            <hr class="my-3 opacity-10">
                            
                            <div class="vstack gap-2">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-light rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; color: var(--secondary);">
                                        <i class="bi bi-envelope small"></i>
                                    </div>
                                    <div class="text-dark small fw-medium text-truncate">${s.email}</div>
                                </div>
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-light rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px; color: var(--secondary);">
                                        <i class="bi bi-telephone small"></i>
                                    </div>
                                    <div class="text-dark small fw-medium">${s.phone || 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-light border-0 p-3 d-flex justify-content-end">
                            <button class="btn btn-outline-danger btn-sm border-0 rounded-pill px-3" data-action="delete" data-id="${s._id}" data-name="${s.name}">
                                <i class="bi bi-trash3 me-1"></i> Delete
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            // Attach event listeners to dynamically created buttons
            document.querySelectorAll('[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', () => openEditModal(btn.dataset.id));
            });
            document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', () => handleDelete(btn.dataset.id, btn.dataset.name));
            });
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Supplier';
            document.getElementById('supplierForm').reset();
            document.getElementById('supplierId').value = '';
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('supplierModal').classList.remove('hidden');
        }

        // Image preview
        document.getElementById('supplierImage').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (ex) {
                    const preview = document.querySelector('#imagePreview img');
                    preview.src = ex.target.result;
                    document.getElementById('imagePreview').classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        async function openEditModal(id) {
            try {
                Loader.show();
                const s = await API.suppliers.getById(id);
                document.getElementById('modalTitle').textContent = 'Edit Supplier';
                document.getElementById('supplierId').value = s._id;
                document.getElementById('name').value = s.name;
                document.getElementById('email').value = s.email;
                document.getElementById('phone').value = s.phone || '';
                document.getElementById('address').value = s.address || '';
                document.getElementById('city').value = s.city || '';
                document.getElementById('country').value = s.country || '';

                if (s.image && s.image !== 'default-supplier.png') {
                    const preview = document.querySelector('#imagePreview img');
                    preview.src = '/uploads/' + s.image;
                    document.getElementById('imagePreview').classList.remove('hidden');
                } else {
                    document.getElementById('imagePreview').classList.add('hidden');
                }

                document.getElementById('supplierModal').classList.remove('hidden');
            } catch (error) {
                Toast.error('Failed to load supplier details');
            } finally {
                Loader.hide();
            }
        }

        function closeModal() {
            document.getElementById('supplierModal').classList.add('hidden');
        }

        document.getElementById('supplierForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('supplierId').value;
            const formData = new FormData();

            formData.append('name', document.getElementById('name').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('phone', document.getElementById('phone').value);
            formData.append('address', document.getElementById('address').value);
            formData.append('city', document.getElementById('city').value);
            formData.append('country', document.getElementById('country').value);

            const file = document.getElementById('supplierImage').files[0];
            if (file) formData.append('image', file);

            try {
                Loader.show();
                if (id) {
                    await API.suppliers.update(id, formData);
                    Toast.success('Supplier updated');
                } else {
                    await API.suppliers.create(formData);
                    Toast.success('Supplier added');
                }
                closeModal();
                loadSuppliers();
            } catch (error) {
                Toast.error(error.message || 'Failed to save supplier');
            } finally {
                Loader.hide();
            }
        };

        function handleDelete(id, name) {
            Confirm.show('Delete Supplier', `Are you sure you want to delete "${name}"?`, async () => {
                try {
                    Loader.show();
                    await API.suppliers.delete(id);
                    Toast.success('Supplier deleted');
                    loadSuppliers();
                } catch (error) {
                    Toast.error('Failed to delete supplier');
                } finally {
                    Loader.hide();
                }
            });
        }
    </script>
</body>

</html>
