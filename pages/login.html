<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OmniStock</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
</head>

<body class="auth-page">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <div class="auth-card animate__animated animate__fadeInUp">
                    <div class="auth-header">
                        <div class="auth-logo">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <h2>OmniStock</h2>
                        <p>Inventory Management System</p>
                    </div>

                    <form id="loginForm">
                        <div class="alert alert-danger d-none" id="errorAlert"></div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                            <span class="btn-text">Login</span>
                            <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
                        </button>
                        <div class="text-center mt-3">
                            <p class="text-muted smaller">Don't have an account? <a href="register.html"
                                    class="text-primary fw-bold">Register here</a></p>
                        </div>
                    </form>

                    <div class="auth-footer">
                        <p class="text-muted">Demo Credentials:</p>
                        <small>Admin: admin@stockomni.com / admin123</small><br>
                        <small>Staff: staff@stockomni.com / staff123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/api-v2.js"></script>
    <script src="../assets/js/auth-v2.js"></script>
    <script src="../assets/js/login.js"></script>
</body>

</html>
