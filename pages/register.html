<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - OmniStock</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="auth-card animate__animated animate__fadeInUp">
                    <div class="auth-header">
                        <div class="auth-logo">
                            <i class="bi bi-box-seam-fill"></i>
                        </div>
                        <h2>Create Account</h2>
                        <p class="text-muted">Register to start managing your inventory</p>
                    </div>

                    <form id="registerForm">
                        <div class="form-group mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" id="name" class="form-control" placeholder="Enter your full name"
                                    required>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" id="email" class="form-control" placeholder="name@company.com"
                                    required>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" class="form-control" placeholder="Min 6 characters"
                                    required minlength="6">
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" id="confirmPassword" class="form-control"
                                    placeholder="Repeat your password" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" id="registerBtn">
                            Create Account
                        </button>

                        <div class="text-center mt-4">
                            <p class="text-muted small">Already have an account? <a href="login.html"
                                    class="text-primary fw-bold text-decoration-none">Login here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api-v2.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Simple client-side validation
            if (password !== confirmPassword) {
                Toast.error('Passwords do not match');
                return;
            }

            try {
                Loader.show();
                document.getElementById('registerBtn').disabled = true;

                const response = await API.auth.register({
                    name,
                    email,
                    password
                });

                Toast.success('Registration successful! Redirecting to login...');

                // Wait for toast to be seen
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error(error);
                Toast.error(error.message || 'Registration failed. Please try again.');
                document.getElementById('registerBtn').disabled = false;
            } finally {
                Loader.hide();
            }
        });
    </script>
</body>

</html>
