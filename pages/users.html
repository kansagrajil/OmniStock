<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - OmniStock</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
</head>

<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <!-- Sidebar content will be loaded by common.js -->
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <main class="main-content">
            <header class="page-header animate__animated animate__fadeInDown">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1">
                            <li class="breadcrumb-item small"><a href="dashboard.html"
                                    class="text-muted text-decoration-none">Dashboard</a></li>
                            <li class="breadcrumb-item small active" aria-current="page">Users</li>
                        </ol>
                    </nav>
                    <div class="d-flex align-items-center gap-2">
                        <h2 class="mb-0 h3 fw-bold">User Management</h2>
                        <span class="badge bg-primary-light text-primary-dark rounded-pill px-3 py-2"
                            id="totalUsersCount">0 Total</span>
                    </div>
                </div>
                <div class="header-actions d-flex gap-2">

                    <div class="search-input-wrapper" style="width: 300px;">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="userSearch" class="form-control ps-5 py-2 border-0 bg-light"
                            placeholder="Search users..." style="border-radius: 10px;">
                    </div>
                </div>
            </header>

            <!-- Users Table -->
            <div class="card border-0 shadow-sm overflow-hidden animate__animated animate__fadeInUp"
                style="border-radius: 16px;">
                <div class="card-header bg-white py-4 border-0">
                    <h5 class="fw-bold mb-0 text-dark">Staff & Administrators</h5>
                    <p class="text-muted small mb-0">Manage system access levels and user profiles.</p>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4 py-3 text-uppercase small fw-bold text-muted">User Info</th>
                                <th class="py-3 text-uppercase small fw-bold text-muted">Email Address</th>
                                <th class="py-3 text-uppercase small fw-bold text-muted text-center">Role</th>
                                <th class="py-3 text-uppercase small fw-bold text-muted text-center">Joined Date</th>
                                <th class="pe-4 py-3 text-uppercase small fw-bold text-muted text-end">Status</th>
                            </tr>
                        </thead>
                        <tbody id="usersList" class="border-top-0">
                            <tr>
                                <td colspan="5" class="text-center p-5">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                    <p class="mt-3 mb-0 text-muted">Loading users...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../assets/js/api-v2.js"></script>
        <script src="../assets/js/auth-v2.js"></script>
        <script src="../assets/js/common.js"></script>
        <script>
            // Check Authentication and Admin role
            if (!checkAuth()) window.location.href = 'login.html';

            if (!isAdmin()) {
                Toast.error('Access Denied: Admin only page');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);
            }

            // Initialize Page
            document.addEventListener('DOMContentLoaded', () => {
                renderSidebar('users');
                loadUsers();

                // Search functionality
                document.getElementById('userSearch').addEventListener('input', (e) => {
                    filterUsers(e.target.value);
                });
            });

            let allUsers = [];

            async function loadUsers() {
                try {
                    Loader.show();
                    allUsers = await API.users.getAll();
                    document.getElementById('totalUsersCount').textContent = `${allUsers.length} Total`;
                    renderUsers(allUsers);
                } catch (error) {
                    console.error('Users Error:', error);
                    Toast.error('Failed to load users');
                    document.getElementById('usersList').innerHTML =
                        '<tr><td colspan="5" class="text-center p-5 text-danger">Error loading system users</td></tr>';
                } finally {
                    Loader.hide();
                }
            }

            function renderUsers(users) {
                const usersList = document.getElementById('usersList');

                if (users.length === 0) {
                    usersList.innerHTML = '<tr><td colspan="5" class="text-center p-5 text-muted">No users found matching your search</td></tr>';
                    return;
                }

                usersList.innerHTML = users.map(user => {
                    const roleClass = user.role === 'admin' ? 'bg-primary-light text-primary' : 'bg-secondary text-white';
                    const statusBadge = user.isNewUser ?
                        '<span class="badge bg-success-light text-success rounded-pill px-3 py-1">New Hire</span>' :
                        '<span class="badge bg-light text-muted border rounded-pill px-3 py-1">Active</span>';

                    return `
                    <tr>
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="bg-primary-light text-primary-dark rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px; font-size: 1rem;">
                                    ${user.name[0].toUpperCase()}
                                </div>
                                <div>
                                    <div class="fw-bold text-dark">${user.name}</strong></div>
                                    <div class="text-muted smaller">ID: ${user._id?.substring(0, 8) || 'N/A'}...</div>
                                </div>
                            </div>
                        </td>
                        <td class="text-dark fw-medium">${user.email}</td>
                        <td class="text-center">
                            <span class="badge ${roleClass} rounded-pill px-3 py-1 text-uppercase small">
                                ${user.role}
                            </span>
                        </td>
                        <td class="text-center text-muted small">${formatDate(user.createdAt)}</td>
                        <td class="pe-4 text-end">
                            ${statusBadge}
                        </td>
                    </tr>
                `;
                }).join('');
            }

            function filterUsers(searchTerm) {
                const term = searchTerm.toLowerCase();
                const filtered = allUsers.filter(user =>
                    user.name.toLowerCase().includes(term) ||
                    user.email.toLowerCase().includes(term)
                );
                renderUsers(filtered);
            }
        </script>


</body>

</html>
