<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - OmniStock</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Lenis for Smooth Scrolling -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
</head>

<body>
    <nav class="sidebar"></nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <header class="page-header animate__animated animate__fadeInDown">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1">
                        <li class="breadcrumb-item small"><a href="dashboard.html"
                                class="text-muted text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item small active" aria-current="page">Reports</li>
                    </ol>
                </nav>
                <div class="d-flex align-items-center gap-2">
                    <h2 class="mb-0 h3 fw-bold">Reports & Analytics</h2>
                    <span class="badge bg-primary-light text-primary-dark rounded-pill px-3 py-2"
                        id="reportDateBadge">Live</span>
                </div>
            </div>
            <div class="header-actions d-flex gap-2">

                <button class="btn btn-primary-light px-4 py-2 rounded-3" onclick="exportPDF()">
                    <i class="bi bi-file-pdf me-2"></i> PDF
                </button>
                <button class="btn btn-primary px-4 py-2 rounded-3" onclick="exportExcel()">
                    <i class="bi bi-file-excel me-2"></i> EXCEL
                </button>
            </div>
        </header>

        <!-- Dynamic Summary Cards -->
        <div class="row g-4 mb-4 animate__animated animate__fadeInUp">
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm transition-hover h-100" style="border-radius: 16px;">
                    <div class="card-body p-4 text-center">
                        <div class="bg-primary-light text-primary rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                            style="width: 64px; height: 64px;">
                            <i class="bi bi-currency-rupee fs-2"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase small mb-2">Total Valuation</h6>
                        <h3 class="fw-bold mb-0" id="totalValuation">₹0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm transition-hover h-100" style="border-radius: 16px;">
                    <div class="card-body p-4 text-center">
                        <div class="bg-warning-light text-warning rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                            style="width: 64px; height: 64px;">
                            <i class="bi bi-exclamation-triangle fs-2"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase small mb-2">Low Stock Items</h6>
                        <h3 class="fw-bold mb-0" id="lowStockCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="card border-0 shadow-sm transition-hover h-100" style="border-radius: 16px;">
                    <div class="card-body p-4 text-center">
                        <div class="bg-danger-light text-danger rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                            style="width: 64px; height: 64px;">
                            <i class="bi bi-box-x fs-2"></i>
                        </div>
                        <h6 class="text-muted fw-bold text-uppercase small mb-2">Inactive (OOS)</h6>
                        <h3 class="fw-bold mb-0" id="inactiveItems">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Inventory Report Table -->
        <div class="card border-0 shadow-sm overflow-hidden animate__animated animate__fadeInUp"
            style="border-radius: 16px;">
            <div class="card-header bg-white py-4 border-0 d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="fw-bold mb-0 text-dark">Full Inventory Status</h5>
                    <p class="text-muted small mb-0">Detailed list of SKU levels, pricing, and valuations.</p>
                </div>
                <div class="d-flex gap-2">
                    <select id="catFilter" class="form-select border-0 bg-light py-2"
                        style="width: 180px; border-radius: 8px;" onchange="loadReport()">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 py-3 text-uppercase small fw-bold text-muted">Product</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted">Category</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted text-center">Unit Price (₹)</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted text-center">Current Stock</th>
                            <th class="py-3 text-uppercase small fw-bold text-muted text-center">Total Value (₹)</th>
                            <th class="pe-4 py-3 text-uppercase small fw-bold text-muted text-end">Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="border-top-0">
                        <tr>
                            <td colspan="6" class="text-center p-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-3 mb-0 text-muted">Generating analysis...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api-v2.js"></script>
    <script src="../assets/js/auth-v2.js"></script>
    <script src="../assets/js/common.js"></script>
    <script>
        if (!checkAuth()) window.location.href = 'login.html';

        document.addEventListener('DOMContentLoaded', async () => {
            renderSidebar('reports');
            await loadInitialData();
            loadReport();
        });

        async function loadInitialData() {
            try {
                const cats = await API.categories.getAll();
                const select = document.getElementById('catFilter');
                select.innerHTML += cats.map(c => `<option value="${c._id}">${c.name}</option>`).join('');
            } catch (e) { }
        }

        async function loadReport() {
            try {
                Loader.show();
                const catId = document.getElementById('catFilter').value;
                const response = await API.reports.getInventory();
                const data = response.products || [];

                let filtered = data;
                if (catId) {
                    filtered = data.filter(p => p.category?._id === catId);
                }

                renderReport(filtered);
                updateSummary(filtered);
            } catch (error) {
                Toast.error('Failed to generate report');
            } finally {
                Loader.hide();
            }
        }

        function renderReport(items) {
            const list = document.getElementById('inventoryList');
            if (!items.length) {
                list.innerHTML = '<tr><td colspan="6" class="text-center p-5 text-muted">No data available for selected category</td></tr>';
                return;
            }

            list.innerHTML = items.map(p => {
                const totalValue = p.price * p.quantity;
                const isOutOfStock = p.quantity === 0;
                const isLowStock = p.quantity <= p.lowStockThreshold && p.quantity > 0;

                let badgeClass = 'bg-success-light text-success';
                let statusText = 'In Stock';

                if (isOutOfStock) { badgeClass = 'bg-danger-light text-danger'; statusText = 'Out of Stock'; }
                else if (isLowStock) { badgeClass = 'bg-warning-light text-warning'; statusText = 'Low Stock'; }

                return `
                    <tr>
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <img src="${p.image ? '/uploads/' + p.image : '../assets/images/placeholder.png'}" 
                                     class="rounded-3 shadow-sm border object-fit-cover" 
                                     style="width: 48px; height: 48px;">
                                <div>
                                    <div class="fw-bold text-dark">${p.name}</div>
                                    <div class="text-muted smaller">SKU: <span class="fw-medium">${p.sku}</span></div>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge bg-primary-light text-primary rounded-pill px-3">${p.category?.name || 'Uncategorized'}</span></td>
                        <td class="text-center font-monospace">${formatCurrency(p.price)}</td>
                        <td class="text-center">
                            <div class="fw-bold">${p.quantity} <span class="smaller text-muted fw-normal">${p.unit || 'Units'}</span></div>
                        </td>
                        <td class="text-center fw-bold text-primary font-monospace">${formatCurrency(totalValue)}</td>
                        <td class="pe-4 text-end">
                            <span class="badge ${badgeClass} rounded-pill px-3 py-1">${statusText}</span>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateSummary(items) {
            const totalVal = items.reduce((sum, p) => sum + (p.price * p.quantity), 0);
            const lowStock = items.filter(p => p.quantity <= p.lowStockThreshold && p.quantity > 0).length;
            const inactive = items.filter(p => p.quantity === 0).length;

            document.getElementById('totalValuation').textContent = formatCurrency(totalVal);
            document.getElementById('lowStockCount').textContent = lowStock;
            document.getElementById('inactiveItems').textContent = inactive;
            document.getElementById('reportDateBadge').textContent = `As of ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        }

        async function exportPDF() {
            API.reports.exportPDF();
            Toast.info('Preparing PDF report...');
        }

        async function exportExcel() {
            API.reports.exportExcel();
            Toast.info('Preparing Excel report...');
        }
    </script>
</body>

</html>
